name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']
        os: [ubuntu-latest, macos-15]
        exclude:
          - python: '3.11'
            os: macos-15
        include:
          - python: '3.11'
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Offline regression tests
        run: python -I -m unittest discover -s skills/ajx/tests -p 'test_*.py'
      - name: CLI smoke test
        run: |
          python skills/ajx/bin/ajx --help
          python skills/ajx/bin/ajx --version

  go:
    name: Go CLI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build
        run: go build -o "$RUNNER_TEMP/ajx" ./cmd/ajx
      - name: Vet
        run: go vet ./...
      - name: Offline tests
        run: go test ./...
      - name: Parity with the Python CLI
        env:
          AJX_PARITY: '1'
        run: go test ./internal/parity/ -run Parity -count=1 -v
      - name: CLI smoke test
        run: |
          "$RUNNER_TEMP/ajx" --help
          "$RUNNER_TEMP/ajx" --version
          "$RUNNER_TEMP/ajx" version
      - name: Installer regression tests
        run: |
          python3 -I .github/scripts/test_install.py
          python3 -I .github/scripts/test_release.py
      - name: Console component tests
        run: node --test .github/scripts/test_console_ui.cjs

  containers:
    name: Container environment integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Resolve the synthetic test environment image
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.13-alpine
          image=$(docker image inspect python:3.13-alpine --format '{{.Id}}')
          echo "AJX_TEST_CONTAINER_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Exercise real container boundaries and lifecycle
        run: python -I -m unittest discover -s skills/ajx/tests -p 'test_*.py'
      - name: Exercise root coordinator ownership
        shell: bash
        run: |
          set -euo pipefail
          sudo -- env AJX_TEST_CONTAINER_IMAGE="$AJX_TEST_CONTAINER_IMAGE" \
            LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \
            "$(command -v python)" -I -m unittest discover \
            -s skills/ajx/tests -p 'test_environment_ownership.py'

  binaries:
    name: Download / ${{ matrix.target }}
    needs: [test, go, containers, security]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-amd64
    env:
      CGO_ENABLED: '0'
      GOFLAGS: -mod=vendor
      GOPROXY: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Test on the package's native platform
        run: go test ./...
      - name: Build and smoke-test the installable package
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python3 -I .github/scripts/package_go.py --output "$RUNNER_TEMP/package" --target "$PACKAGE_TARGET"
      - name: Install and exercise the packaged CLI and skill
        env:
          AJX_INSTALL_TEST_PACKAGE: ${{ runner.temp }}/package
        run: python3 -I .github/scripts/test_install.py
      - name: Upload the tested package
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ajx-${{ matrix.target }}
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Show the download
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          TARGET: ${{ matrix.target }}
        run: |
          printf '### AJX %s\n\n[Download the tested package](%s)\n\nCommit: `%s`\n' \
            "$TARGET" "$ARTIFACT_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish versioned release
    needs: [binaries]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release of main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Download the four tested packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'ajx-*' --dir "$RUNNER_TEMP/packages"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/publish_release.py --packages "$RUNNER_TEMP/packages" --output "$RUNNER_TEMP/release" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"

  security:
    name: Secrets and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan contribution history, excluding GitHub's temporary PR merge metadata.
          # Runtime jobs above still test the proposed merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          mkdir -p ajx-security-bin
          tar -xzf gitleaks.tar.gz -C ajx-security-bin gitleaks
          echo "$RUNNER_TEMP/ajx-security-bin" >> "$GITHUB_PATH"
      - name: Verify disclosure rules and staged-content hook
        run: python3 -I .github/scripts/test_security.py
      - name: Scan complete history and commit and tag metadata
        shell: bash
        run: .githooks/pre-push </dev/null
