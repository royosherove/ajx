# Cloud task example: the worker creates real AWS resources in a sandbox account while Claude Code
# reaches Bedrock through a different profile:
#   model  [auth.bedrock-model]: claude-bedrock with its own AWS_PROFILE and an isolated config dir
#   task   the profile named in task-prompt.md, passed as --profile everywhere below
# The agent's tool shell inherits the model's AWS_PROFILE, so an aws command or SDK script that omits
# --profile acts in the model's account; doctor prints that default identity and warns when it is not
# the task's. Use a model account you would accept that risk in, or one with no rights beyond Bedrock.
# Replace ajx-task-sandbox and bedrock-model with real profiles (here and in the prompt), then
# `ajx2 doctor trial.toml` must show the task identity you expect, with no FAILED lines.
[trial]
id = "aws-ec2-claude-vm"
product = "aws-cli"
product_version_cmd = "aws --version"
workspace_root = "/tmp"
repetitions = 1
parallel = 1                      # keep 1: runs share the prompt's tag, so a parallel run's teardown would delete a sibling's resources
timeout_seconds = 3600
narrate_timeout_seconds = 900
max_budget_usd = 15
order_seed = 0
cache = "isolated"

[task]
prompt_file = "task-prompt.md"    # names the task profile, the region and the tag
materials = ["https://docs.aws.amazon.com/cli/latest/userguide/cli-chap-getting-started.html"]
human = "unavailable"
# The account the worker acts in, checked the way the prompt tells the agent to authenticate. doctor
# runs it in the worker's own tool shell (worker env, $SHELL -c, harness settings env) and again in the
# verify/teardown shell, and fails if either errors.
identity_cmd = "aws sts get-caller-identity --profile ajx-task-sandbox --output text"

# No [env] AWS_PROFILE / AWS_REGION: under claude-bedrock those are the model's credentials, and shell
# startup files (~/.zshenv) can replace them in the agent's tool shell anyway. An explicit --profile
# beats both.

[[preflight]]                     # each run: must pass before its worker starts; same env as verify/teardown
name = "task profile authenticates"
run = "aws sts get-caller-identity --profile ajx-task-sandbox --region us-east-1"

[[preflight]]
name = "teardown can list EC2 in the task account"
run = "aws ec2 describe-instances --profile ajx-task-sandbox --region us-east-1 --max-results 5 --query 'length(Reservations)'"

[[verify]]
name = "instance id was saved and the instance existed with the requested tag"
run = "id=$(tr -d '[:space:]' < instance-id.txt) && test -n \"$id\" && aws ec2 describe-instances --profile ajx-task-sandbox --region us-east-1 --instance-ids \"$id\" --query \"Reservations[0].Instances[0].Tags[?Key=='Project'].Value\" --output text | grep -qx claude-vm-trial"
scope = "an instance with the saved ID existed in us-east-1 tagged Project=claude-vm-trial"

[[verify]]
name = "claude --version output was saved"
run = "test -s claude-version.txt && grep -Eq '[0-9]+\\.[0-9]+\\.[0-9]+' claude-version.txt"
scope = "a file with a version number exists; does not prove it came from the instance"

[[verify]]
name = "nothing tagged is left running"
# `n=$(aws ...) &&` fails when aws fails; `! aws ... | grep -q` would pass without credentials
run = "n=$(aws ec2 describe-instances --profile ajx-task-sandbox --region us-east-1 --filters Name=tag:Project,Values=claude-vm-trial Name=instance-state-name,Values=pending,running,stopping,stopped --query 'length(Reservations[].Instances[])' --output text) && echo running=$n && test \"$n\" = 0"
scope = "no instance tagged Project=claude-vm-trial is pending, running or stopped; untagged resources are not covered"

[[teardown]]                      # by the prompt's tag; exits non-zero on any failure (no `set +e ... true`)
timeout = 900
run = """
R="--profile ajx-task-sandbox --region us-east-1"
T="Name=tag:Project,Values=claude-vm-trial"
rc=0
ids=$(aws ec2 describe-instances $R --filters $T Name=instance-state-name,Values=pending,running,stopping,stopped --query 'Reservations[].Instances[].InstanceId' --output text) || rc=1
saved=$(tr -d '[:space:]' < instance-id.txt 2>/dev/null)
ids=$(echo $ids $saved | xargs -n1 | sort -u | xargs)
if [ -n "$ids" ]; then
  aws ec2 terminate-instances $R --instance-ids $ids > /dev/null || rc=1
  aws ec2 wait instance-terminated $R --instance-ids $ids || rc=1
fi
kps=$(aws ec2 describe-key-pairs $R --filters $T --query 'KeyPairs[].KeyPairId' --output text) || rc=1
for kp in $kps; do aws ec2 delete-key-pair $R --key-pair-id $kp || rc=1; done
sgs=$(aws ec2 describe-security-groups $R --filters $T --query 'SecurityGroups[].GroupId' --output text) || rc=1
for sg in $sgs; do aws ec2 delete-security-group $R --group-id $sg || rc=1; done
exit $rc
"""

[reporter]
harness = "claude-code"
auth = "bedrock-model"

# The model's credentials: a fresh CLAUDE_CONFIG_DIR per run, so ~/.claude/settings.json env does not
# apply. The agent's commands inherit this AWS_PROFILE as their default, which is why every task
# command above names its --profile.
[auth.bedrock-model]
type = "claude-bedrock"
env = { AWS_PROFILE = "bedrock-model", AWS_REGION = "us-east-1" }
identity_cmd = ["aws", "sts", "get-caller-identity", "--profile", "bedrock-model", "--output", "text"]

[[cells]]
id = "cc"
harness = "claude-code"
models = ["sonnet", "opus"]       # one run per model: cc-sonnet-r1, cc-opus-r1
config = "clean"
auth = "bedrock-model"
