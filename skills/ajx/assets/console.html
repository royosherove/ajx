<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>AJX Console</title>
<link rel="stylesheet" href="/static/console.css">
<script src="/static/console.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand">AJX <small>Console</small></div>
  <div class="trialname" id="trialname"></div>
  <div class="chips" id="chips"></div>
</header>
<div class="strip">You decide here. Your agent drafts the trial and explains results in chat, and it learns what you did here the next time it checks (see Activity). Closing this page, the terminal or the chat never stops a run.</div>
<div class="offline-banner" id="offline" role="alert" hidden></div>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" id="tabbtn-plan" aria-controls="tab-plan" data-tab="plan" aria-selected="true">Plan</button>
  <button role="tab" id="tabbtn-live" aria-controls="tab-live" data-tab="live" aria-selected="false">Live</button>
  <button role="tab" id="tabbtn-results" aria-controls="tab-results" data-tab="results" aria-selected="false">Results</button>
  <button role="tab" id="tabbtn-activity" aria-controls="tab-activity" data-tab="activity" aria-selected="false">Activity</button>
</nav>
<main>
  <section id="tab-plan" class="tab" role="tabpanel" aria-labelledby="tabbtn-plan"></section>
  <section id="tab-live" class="tab" role="tabpanel" aria-labelledby="tabbtn-live" hidden></section>
  <section id="tab-results" class="tab" role="tabpanel" aria-labelledby="tabbtn-results" hidden></section>
  <section id="tab-activity" class="tab" role="tabpanel" aria-labelledby="tabbtn-activity" hidden></section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p class="nojs">The AJX Console needs JavaScript.</p></noscript>
</body>
</html>
